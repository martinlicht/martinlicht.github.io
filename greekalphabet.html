<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greek Alphabet</title>
    <style>
        @page {
            size: A4;
            margin: 20mm;
        }

        * {
            box-sizing: border-box;
        }

        .header {
            width: 100%;
            text-align: left;
            top: 0;
            border-bottom: 1px solid #ccc;
        }

        body {
            font-family: Arial, sans-serif;
            font-size: 18pt;
            line-height: 1.6;
            margin: 3em;
            padding: 0;
        }

        .content {
            display: flex;
            flex-wrap: wrap;
            gap: 1em;
            align-items: flex-start;
        }

        .table-block {
            flex: 1 1 18em;
            min-width: min(100%, 18em);
        }

        h1, h2, h3 {
            color: #333;
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20mm;
            break-inside: avoid;
            border: 0.1em solid black;
        }

        th, td {
            border-top: 0.1em solid black;
            padding: 8px;
            text-align: left;
        }

        table, th, td {
            border: 1px solid black;
        }

        td:nth-child(1) {
            text-align: center;
        }

        td:nth-child(2),
        td:nth-child(3) {
            text-align: left;
        }

        @media screen and (max-width: 700px) {
            body {
                margin: 1em;
                font-size: 14pt;
            }

            .content {
                flex-direction: column;
            }

            .table-block {
                width: 100%;
                flex-basis: auto;
            }
        }
        
        @media print {
            .header, .footer {
                position: fixed;
            }

            .header {
                top: 0;
            }

            .footer {
                bottom: 0;
            }
            
            body {
                margin: 0;
            }
        
            .content {
                flex-wrap: nowrap;
            }

            .table-block {
                flex: 1 1 0;
                min-width: 0;
            }

            table {
                margin-bottom: 0;
            }
            
            table, th, td {
                border: 0.1em solid black;
            }
            
            
        }

        
    </style>
</head>
<body>
    <h1>Ancient Greek Alphabet</h1>
    <div class="content">
        <div class="table-block">
            <table>
                <tr>
                    <th colspan="2">Letter</th>
                    <th>Name</th>
                </tr>
                <tr>
                    <td>Α</td>
                    <td>α</td>
                    <td>Alpha</td>
                </tr>
                <tr>
                    <td>Β</td>
                    <td>β&nbsp;ϐ</td>
                    <td>Beta</td>
                </tr>
                <tr>
                    <td>Γ</td>
                    <td>γ</td>
                    <td>Gamma</td>
                </tr>
                <tr>
                    <td>Δ</td>
                    <td>δ</td>
                    <td>Delta</td>
                </tr>
                <tr>
                    <td>Ε</td>
                    <td>ε</td>
                    <td>Epsilon</td>
                </tr>
                <tr>
                    <td>Ζ</td>
                    <td>ζ</td>
                    <td>Zeta</td>
                </tr>
                <tr>
                    <td>Η</td>
                    <td>η</td>
                    <td>Eta</td>
                </tr>
                <tr>
                    <td>Θ</td>
                    <td>θ&nbsp;ϑ</td>
                    <td>Theta</td>
                </tr>
                <tr>
                    <td>Ι</td>
                    <td>ι</td>
                    <td>Iota</td>
                </tr>
                <tr>
                    <td>Κ</td>
                    <td>κ&nbsp;ϰ</td>
                    <td>Kappa</td>
                </tr>
                <tr>
                    <td>Λ</td>
                    <td>λ</td>
                    <td>Lambda</td>
                </tr>
                <tr>
                    <td>Μ</td>
                    <td>μ</td>
                    <td>Mu</td>
                </tr>
            </table>
        </div>
        <div class="table-block">
            <table>
                <tr>
                    <th colspan="2">Letter</th>
                    <th>Name</th>
                </tr>
                <tr>
                    <td>Ν</td>
                    <td>ν</td>
                    <td>Nu</td>
                </tr>
                <tr>
                    <td>Ξ</td>
                    <td>ξ</td>
                    <td>Xi</td>
                </tr>
                <tr>
                    <td>Ο</td>
                    <td>ο</td>
                    <td>Omicron</td>
                </tr>
                <tr>
                    <td>Π</td>
                    <td>π&nbsp;ϖ</td>
                    <td>Pi</td>
                </tr>
                <tr>
                    <td>Ρ</td>
                    <td>ρ&nbsp;ϱ</td>
                    <td>Rho</td>
                </tr>
                <tr>
                    <td>Σ</td>
                    <td>σ&nbsp;ς</td>
                    <td>Sigma</td>
                </tr>
                <tr>
                    <td>Τ</td>
                    <td>τ</td>
                    <td>Tau</td>
                </tr>
                <tr>
                    <td>Υ&nbsp;ϒ</td>
                    <td>υ</td>
                    <td>Upsilon</td>
                </tr>
                <tr>
                    <td>Φ</td>
                    <td>φ&nbsp;ϕ</td>
                    <td>Phi</td>
                </tr>
                <tr>
                    <td>Χ</td>
                    <td>χ</td>
                    <td>Chi</td>
                </tr>
                <tr>
                    <td>Ψ</td>
                    <td>ψ</td>
                    <td>Psi</td>
                </tr>
                <tr>
                    <td>Ω</td>
                    <td>ω</td>
                    <td>Omega</td>
                </tr>
            </table>
        </div>
    </div>
</body>
</html>
